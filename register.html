<!DOCTYPE html>
<html>

<head>
    <title>Event Registration</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>Event Registration</h1>
    <p>Register for your favourite campus event</p>
</header>


<nav>
    <a href="index.html">Home</a>
    <a href="events.html">Events</a>
    <a href="register.html">Register</a>
    <a href="contact.html">Contact</a>
    <a href="login.html">Login</a>
</nav>


<section class="registration">

    <h2>Student Registration Form</h2>

    <form>

        <label>Name:</label>
        <input type="text" placeholder="Enter your name">


        <label>Email:</label>
        <input type="email" placeholder="Enter your email">


        <label>Department:</label>
        <input type="text" placeholder="Enter your department">


        <label>Year:</label>
        <select>
            <option>Select Year</option>
            <option>1st Year</option>
            <option>2nd Year</option>
            <option>3rd Year</option>
            <option>4th Year</option>
        </select>


        <label>Select Event:</label>
        <select id="event">
            <option>Hackathon 2026</option>
            <option>Tech Workshop</option>
            <option>Cultural Fest</option>
        </select>

        <button type="button" onclick="showMessage()">
Submit Registration
</button>
        </form>

</section>


<footer>
    <p>© 2026 Campus Event Management System</p>
</footer>

<script src="js/script.js"></script>
</body>
</html>
