<!DOCTYPE html>
<html>

<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>Admin Dashboard</h1>
    <p>Manage Campus Events</p>
</header>


<nav>
    <a href="index.html">Home</a>
    <a href="events.html">Events</a>
    <a href="admin.html">Admin</a>
</nav>


<section class="admin">

    <h2>Add New Event</h2>

    <form>

        <label>Event Name:</label>
        <input type="text" placeholder="Enter event name">


        <label>Date:</label>
        <input type="date">


        <label>Venue:</label>
        <input type="text" placeholder="Enter venue">


        <label>Description:</label>
        <textarea placeholder="Enter event description"></textarea>


        <button>Add Event</button>

    </form>


    <h2>Existing Events</h2>

    <div class="event-list">

        <p>💻 Hackathon 2026 - August 15</p>

        <p>🎤 Tech Workshop - September 5</p>

        <p>🎭 Cultural Fest - October 10</p>

    </div>


</section>


<footer>
    <p>© 2026 Campus Event Management System</p>
</footer>


</body>
</html>
